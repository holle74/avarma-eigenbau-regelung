# ============================================================================
# ENDE VOLLAUSLESUNG PARAMETERBLOCK 0x2000
# ============================================================================

# -------------------- Sollwerte lesen (0x1000) --------------------

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Vorlauf Solltemperatur Istwert"
    id: heating_setpoint_read
    register_type: holding
    address: 4098
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

# -------------------- Binaerzustaende --------------------
binary_sensor:

  # C49 (Adresse 4609): 0 = Normalbetrieb, 1 = Oelrueckfuehrung laeuft.
  # Kein skip_updates: Der Vorgang dauert nur wenige Minuten, bei den 10 s des
  # Controllers wird er sicher erfasst. Damit laesst sich beobachten, wie oft und
  # wie lange die Avarma Oel zurueckholt - und spaeter der Kompressor-Deckel
  # gezielt nur waehrend dieser Phasen anheben, statt ihn dauerhaft hoch zu halten.
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Oelrueckfuehrung aktiv"
    id: oil_return_active
    register_type: holding
    address: 4609
    bitmask: 0x1

  # Register 6666 (0x1A00+10) "Forbid Defrosting enabled" aus dem Override-Block
  # der Avarma - demselben Block, in dem sich auch Kompressorfrequenz, Luefter und
  # Expansionsventil zwangsweise vorgeben lassen. Steht das Flag auf 1, taut die
  # Anlage ueberhaupt nicht mehr ab. Wird hier nur beobachtet, nicht geschrieben:
  # wenn es je auf 1 steht, ist das die Erklaerung und kein Regelthema.
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Abtauung gesperrt"
    id: forbid_defrost
    register_type: holding
    address: 6666
    skip_updates: 30
    bitmask: 0x1
    entity_category: diagnostic

# -------------------- Steuerung: Sollwerte & Parameter schreiben --------------------
number:

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Vorlauf Solltemperatur"
    id: heating_setpoint
    register_type: holding
    address: 4098
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 10
    max_value: 75
    step: 1

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Kühlbetrieb Solltemperatur"
    id: cooling_setpoint
    register_type: holding
    address: 4099
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 7
    max_value: 25
    step: 1

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Kompressor Maximalfrequenz"
    id: compressor_max_freq
    register_type: holding
    address: 8235
    value_type: U_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    min_value: 50
    max_value: 120
    step: 1

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Kompressor Minimalfrequenz"
    id: compressor_min_freq
    register_type: holding
    address: 8236
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: U_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    min_value: 0
    max_value: 90
    step: 1

  # P114 - "Compressor frequency reduction percentage after set temp. reached":
  # wie weit der Kompressor seine Frequenz zurueckfahren DARF, sobald die
  # Vorlauf-Solltemperatur erreicht ist. Bereich 0~60 %, Werkseinstellung 2 %.
  #
  # Richtung (der Betreiber, 2026-08-24 - anders herum, als die englische Formulierung
  # nahelegt): Der Wert ist ein Modulations-SPIELRAUM, keine Abschalt-Aggressivitaet.
  #   kleiner Wert  = der Kompressor darf kaum heruntermodulieren. Trifft er die
  #                   kleine Last damit nicht, laeuft der Vorlauf ueber den Sollwert
  #                   und dem Regler bleibt nur das Abschalten -> die Anlage taktet.
  #   grosser Wert  = breiterer Modulationsbereich, der Kompressor tastet sich an
  #                   den VL-Soll heran und laeuft durch.
  # Bei den hier abgelesenen 3 % steht die Anlage also am taktfreudigen Ende.
  #
  # Keine Skalierung ("actual value"), deshalb kein multiply.
  #
  # Korrigiert 2026-08-24: stand vorher auf 8303. Das ist laut Hofman-Tabelle
  # aber P115 "Outlet temp. too high protection value" (70~90 °C) - der
  # Uebertemperatur-Schutz des Vorlaufs, nicht die Frequenzruecknahme. Die
  # Entity las entsprechend 83, ein Wert, den P114 gar nicht annehmen kann.
  # Gefaehrlich war dabei nicht das Lesen, sondern das Schreiben: mit
  # min_value 0 / max_value 60 haette ein Zug am Regler den Schutz von 83 °C
  # auf einen einstelligen Wert gesetzt und die Anlage in Dauerstoerung
  # geschickt. Der Wert stand unveraendert auf 83, es wurde also nie
  # geschrieben. Dieselbe Adressspalten-Falle wie bei Fehlercode 4389/4390:
  # "Decimal" ist die echte Modbus-Adresse, "Decimal+1" nur die Panel-Anzeige.
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Frequenzreduktion bei VL-Soll erreicht"
    id: freq_reduction_at_setpoint
    register_type: holding
    address: 8302
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 0
    max_value: 60
    step: 1

  # P63 - Warmwasserfunktion: 0=deaktiviert, 1=aktiv
  # Auf 0 setzen wenn kein Warmwasserspeicher vorhanden!
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Warmwasserfunktion"
    id: dhw_function
    register_type: holding
    address: 8253
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: U_WORD
    min_value: 0
    max_value: 1
    step: 1

  # P87 (Register 8277, Werkseinstellungen zurücksetzen) bewusst NICHT als Entity
  # angelegt - 2026-08-18 entfernt. Ein versehentlicher Klick in der HA-Oberfläche
  # würde die komplette Reglerparametrierung der Anlage verwerfen; der Nutzen einer
  # Fernbedienbarkeit steht in keinem Verhältnis dazu. Im Servicefall über das
  # Bedienpanel der Wärmepumpe auslösen.

  # P72 - Lüfter manuelle Solldrehzahl (nur wirksam wenn P71 = Manuell)
  # Register speichert RPM/10 (Hofman-Doku: "display value*10"), empirisch bestätigt
  # 2026-07-23: Rohwert 40 geschrieben -> Istwert-Sensor meldete 400 RPM.
  # multiply beim number-Platform wirkt umgekehrt zum sensor-Platform:
  # geschriebener Rohwert = Anzeigewert * multiply, Anzeigewert = Rohwert / multiply.
  # Mit 0.1 zeigt und nimmt die Entity also echte RPM. min/max/step sind ebenfalls
  # Anzeigewerte, 1500 RPM entspricht damit Rohwert 150.
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Lüfter Solldrehzahl (manuell)"
    id: fan_manual_speed
    register_type: holding
    address: 8262
    value_type: U_WORD
    unit_of_measurement: "RPM"
    multiply: 0.1
    min_value: 0
    max_value: 1500
    step: 10

  # P29 - Abtau-Start-Verdampfertemperatur
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Abtau Start Verdampfertemperatur"
    id: defrost_start_coil_temp
    register_type: holding
    address: 8219
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: S_WORD
    unit_of_measurement: "°C"
    multiply: 10
    min_value: -8
    max_value: 5
    step: 0.1

  # P30 - Abtau-Ende-Verdampfertemperatur
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Abtau Ende Verdampfertemperatur"
    id: defrost_end_coil_temp
    register_type: holding
    address: 8220
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: S_WORD
    unit_of_measurement: "°C"
    multiply: 10
    min_value: 5
    max_value: 30
    step: 0.1

  # P61 - Mindestdurchfluss, unterhalb dessen die Anlage E15 "Water flow error"
  # meldet. Bereich 3~80 L/min, Werkswert dieser Anlage 11 (den Werksreset vom
  # 25.08.2026 hat er unveraendert ueberstanden).
  #
  # WARUM SCHREIBBAR (2026-08-25): E15 tritt seit dem 24.08. bei jedem
  # Start auf, sobald der Kompressor Leistung aufbaut. Alle anderen Ursachen sind
  # ausgeschlossen (Werksreset, Kaltstart, Handbetrieb, offene Ventile, Strom- und
  # Spreizungsgrenzen weit entfernt). Einen echten Durchflussmesswert haben wir
  # nicht - der als "Durchfluss" gefuehrte Wert ist aus der Pumpendrehzahl
  # gerechnet (exakt Pumpe * 0,22 ueber den gesamten Bereich).
  #
  # Das Absenken auf 9 ist deshalb ein MESSVERFAHREN, keine Reparatur: Laeuft sie
  # mit 9 durch, liegt der echte Durchfluss zwischen 9 und 11 L/min und die
  # Behinderung ist gering. Stoert sie weiter, liegt er unter 9.
  #
  # ACHTUNG - nicht als Dauereinstellung gedacht: Unterhalb des Herstellerwerts
  # laeuft die Anlage mit zu wenig Wasser. Kritisch ist das vor allem beim
  # Abtauen, wo der umgekehrte Kreislauf einem kleinen Wasservolumen Waerme
  # entzieht und der Plattenwaermetauscher einfrieren kann. Nach dem Test zurueck
  # auf 11.
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Mindestdurchfluss"
    id: min_water_flow
    register_type: holding
    address: 8251
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: U_WORD
    unit_of_measurement: "L/min"
    min_value: 3
    max_value: 80
    step: 1

  # P86 - geforderte Differenz Umgebung/Lamelle fuer den Abtaustart (AT >= -7 °C).
  # Am 24.08.2026 mit 8,0 K ausgelesen; Werkseinstellung laut Hofman-Tabelle 5 K.
  # Auf 5 K gesenkt, damit die Abtauung frueher zulaessig wird - am 24.08. war
  # dieses Kriterium zwar nicht der Flaschenhals (es war ab 08:42 erfuellt,
  # abgetaut wurde erst 09:20), aber ein niedrigerer Wert kostet nichts und
  # nimmt eine Bedingung aus dem Spiel.
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Abtau Differenz Umgebung-Lamelle"
    id: defrost_delta_t1
    register_type: holding
    address: 8276
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: S_WORD
    unit_of_measurement: "°C"
    multiply: 10
    min_value: 0
    max_value: 20
    step: 0.1

  # P91 - dieselbe Differenz, gilt aber bei Aussentemperatur < -7 °C.
  # Steht ebenfalls auf 8,0 K. Bewusst NICHT mitgeaendert: im echten Frost ist
  # eine grosse Differenz normal, dort wuerde ein zu kleiner Wert die Anlage in
  # Dauerabtauung schicken. Schreibbar gemacht, damit im Winter nachjustiert
  # werden kann, ohne nochmal zu flashen.
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Abtau Differenz Umgebung-Lamelle (kalt)"
    id: defrost_delta_t2
    register_type: holding
    address: 8281
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: S_WORD
    unit_of_measurement: "°C"
    multiply: 10
    min_value: 0
    max_value: 20
    step: 0.1

  # P58 - C1 Wasserpumpe Regelungs-Temperaturdifferenz
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "C1 Wasserpumpe Regel-Temperaturdifferenz"
    id: c1_pump_regulation_diff
    register_type: holding
    address: 8248
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: S_WORD
    unit_of_measurement: "°C"
    multiply: 10
    min_value: 3
    max_value: 8
    step: 0.1

  # P59 - PWM Wasserpumpe Minimaldrehzahl
  # Empirisch bestätigt (2026-07-14): Rohwert ist in 10%-Schritten (Rohwert 8 = 80%,
  # passte zum damaligen Ist-Wert von "C1 Wasserpumpenleistung"). multiply: 0.1, da bei
  # number.modbus_controller Anzeigewert = Rohwert / multiply gilt (invertierte Logik ggü. sensor-Filtern).
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "PWM Wasserpumpe Minimaldrehzahl"
    id: pwm_pump_min_speed
    register_type: holding
    address: 8249
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: U_WORD
    unit_of_measurement: "%"
    multiply: 0.1
    min_value: 20
    max_value: 80
    step: 10

  # Agent-Heartbeat: rein virtuell, kein Modbus-Register. AppDaemon schreibt hier
  # periodisch den aktuellen Unix-Timestamp rein, solange es aktiv VLT/Kompressor
  # steuert. Jeder Schreibvorgang aktualisiert den Watchdog-Zeitstempel unten.
  - platform: template
    name: "Agent Heartbeat"
    id: agent_heartbeat
    unit_of_measurement: "s"
    min_value: 0
    max_value: 9999999999
    step: 1
    optimistic: true
    on_value:
      then:
        - globals.set:
            id: letzter_heartbeat_millis
            value: !lambda 'return millis();'
        - globals.set:
            id: agent_hat_kontrolle
            value: 'true'

# -------------------- Agent-Heartbeat: Watchdog --------------------
# Bleibt der Heartbeat >30 Min aus, waehrend der Agent zuvor aktiv war,
# fallen VLT und Kompressor-Maximalfrequenz auf konservative Sicherheitswerte
# zurueck (aktuell bewaehrte Werte: 32°C / 90 Hz).
interval:
  - interval: 60s
    then:
      - if:
          condition:
            lambda: |-
              return id(agent_hat_kontrolle) &&
                (millis() - id(letzter_heartbeat_millis) > 1800000);
          then:
            - logger.log: "Agent-Heartbeat seit >30 Min ausgeblieben - Fallback auf konservative Sicherheitswerte"
            - number.set:
                id: heating_setpoint
                value: 32
            - number.set:
                id: compressor_max_freq
                value: 90
            - globals.set:
                id: agent_hat_kontrolle
                value: 'false'

# -------------------- Steuerung: Ein/Aus --------------------
switch:

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Wärmepumpe Ein-Aus"
    id: heatpump_onoff
    register_type: holding
    address: 4096
    restore_mode: DISABLED

# -------------------- Notknopf: Abtauung von Hand --------------------
# Register 4103 (0x1000+7) "Forced Defrosting" liegt im Steuerblock, direkt neben
# Ein/Aus und den Solltemperaturen - also der Live-Befehlsweg, nicht der
# Parameterblock. Deshalb dieser statt P28 (Reg 8218, select "Abtaumodus"):
#   1 = Abtauung sofort starten
#   0 = laufende Abtauung abbrechen
# Der Regler setzt das Register nach der Abtauung selbst auf 0 zurueck; der
# Schalter faellt beim naechsten Lesezyklus also von allein wieder auf "aus".
#
# restore_mode: DISABLED ist hier Absicht: nach einem Reboot des ESP darf auf
# keinen Fall automatisch eine Abtauung ausgeloest werden.
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Abtauung erzwingen"
    id: forced_defrost
    register_type: holding
    address: 4103
    restore_mode: DISABLED

# -------------------- Steuerung: Betriebsmodus --------------------
select:

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Betriebsmodus Wahl"
    id: mode_select
    address: 4097
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: U_WORD
    optionsmap:
      "Heizen": 2
      "Kühlen": 4

  # P71 - Lüftersteuerung: Manuell = Register 8262 (P72) wird verwendet
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Lüftersteuerung Modus"
    id: fan_control_mode
    address: 8261
    value_type: U_WORD
    optionsmap:
      "Manuell": 0
      "Automatisch": 1

  # P87 - Werksreset (2026-08-25).
  #
  # Bewusst ein select und kein switch: Ein Schalter laesst sich mit einem
  # Fehltipper ausloesen, hier muss man einen Eintrag bewusst auswaehlen.
  #
  # Wirkt laut Hofman-Tabelle NUR im ausgeschalteten Zustand ("effective in
  # shutdown state"). Die WP muss also aus sein, sonst passiert nichts.
  #
  # Vor dem Ausloesen: Parameterblock sichern. Der Sensorblock "VOLLAUSLESUNG
  # PARAMETERBLOCK 0x2000" weiter oben liest alle Register roh aus.
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Werksreset ausloesen"
    id: factory_reset
    address: 8277
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: U_WORD
    optionsmap:
      "Normalbetrieb": 0
      "WERKSRESET": 1

  # P28 - Abtaumodus (setzt sich nach erzwungenem Abtauen automatisch auf 0 zurück)
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Abtaumodus"
    id: defrost_mode
    address: 8218
    skip_updates: 30  # Konfigurationsregister: alle 5 min statt alle 10 s
    value_type: U_WORD
    optionsmap:
      "Automatisch": 0
      "Erzwungen": 1