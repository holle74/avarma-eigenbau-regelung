# -------------------- Basis-Konfiguration --------------------
esphome:
  name: esphome-web-f34aa0
  friendly_name: ESPHome Web AVARMA
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

# -------------------- WLAN --------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Optional feste IP - eigene Werte eintragen oder den Block weglassen (DHCP)
  # manual_ip:
  #   static_ip: 192.168.x.x
  #   gateway: 192.168.x.1
  #   subnet: 255.255.255.0

# -------------------- UART / RS485 --------------------
uart:
  id: modbus_uart_bus
  tx_pin: 17
  rx_pin: 18
  baud_rate: 9600

# -------------------- Modbus --------------------
modbus:
  id: modbus1
  uart_id: modbus_uart_bus
  flow_control_pin: 21
  send_wait_time: 50ms

modbus_controller:
  - id: modbus_device
    address: 0x1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 10s
    # command_throttle entfernt 2026-08-25: seit ESPHome 2026.8 wirkungslos
    # ("Command spacing is handled by the 'modbus' component"). Die Befehlspause
    # macht send_wait_time: 50ms oben im modbus:-Block.

# -------------------- Agent-Heartbeat: Zustand --------------------
# Sicherheitsnetz fuer die geplante AppDaemon-Regelung (VLT/Kompressor).
# Solange der Agent nie aktiv eingreift, bleibt agent_hat_kontrolle false
# und der Watchdog weiter unten tut nichts - stoert also keine manuelle Bedienung.
globals:
  - id: letzter_heartbeat_millis
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: agent_hat_kontrolle
    type: bool
    restore_value: no
    initial_value: 'false'

# -------------------- Temperaturen (0x1100, Faktor x0.1 °C) --------------------
sensor:

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Außentemperatur"
    id: ambient_temp
    register_type: holding
    address: 4360
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Vorlauftemperatur"
    id: water_outlet_temp
    register_type: holding
    address: 4366
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Rücklauftemperatur"
    id: water_inlet_temp
    register_type: holding
    address: 4365
