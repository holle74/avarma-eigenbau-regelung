# -------------------- Spannung --------------------

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Netzspannung"
    id: ac_voltage
    register_type: holding
    address: 4381
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement

# -------------------- Status & Betrieb (0x1200) --------------------

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Betriebsmodus"
    id: running_mode
    register_type: holding
    address: 4612
    value_type: U_WORD
    state_class: measurement
    # 0=Aus, 1=Warmwasser, 2=Heizen, 4=Kühlen

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Abtauvorgänge"
    id: defrost_count
    register_type: holding
    address: 4613
    value_type: U_WORD
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Betriebsstatus"
    id: operating_status
    register_type: holding
    address: 4354
    value_type: U_WORD
    # bit0=Standby, bit1=Ein, bit2=Aus, bit4=Abtauen, bit9=Frostschutz

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Fehlercode 0"
    id: fault_state_0
    register_type: holding
    address: 4390
    value_type: U_WORD
    # Fault State 0, Bits E01-E16. 0 = kein Fehler.
    # Korrigiert 2026-08-18: stand vorher auf 4389, das ist laut Hofman-Tabelle
    # aber "Calculating Temperature From Energy Requirements" (0,1 °C), keine
    # Fehlermaske. Die Tabelle listet zwei Adressspalten - "Decimal" ist die
    # echte Modbus-Adresse, "Decimal+1" nur die Anzeige am Bedienpanel.

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Fehlercode 1"
    id: fault_state_1
    register_type: holding
    address: 4391
    value_type: U_WORD
    # Fault State 1, Bits E17-E32 (u.a. Netzspannungsfehler).
    # Korrigiert 2026-08-18: stand vorher auf 4390 und las damit Fault State 0.

# -------------------- Oelrueckfuehrung (2026-08-22) --------------------
# Der Verdichter braucht periodisch eine hoehere Drehzahl, damit das Schmieroel
# aus dem Kreislauf zurueckgefoerdert wird; bei dauerhaft niedriger Frequenz
# sammelt es sich im Verdampfer und in den Leitungen. Beide Register werden
# gebraucht, seit heizung_vlt_kompressor_regelung.py die Kompressor-
# Maximalfrequenz lastabhaengig deckelt: Solange unbekannt ist, ob P46 den
# Oelrueckfuehrungsmodus begrenzt, muss der Deckel vorsorglich hoch bleiben.
#
# P41 bewusst als Sensor und NICHT als number: Es ist eine Herstellereinstellung,
# an der im Normalbetrieb niemand drehen sollte. Aendern im Servicefall ueber das
# Bedienpanel - dieselbe Ueberlegung wie bei P87 (Werksreset), der aus demselben
# Grund gar nicht erst angelegt ist.

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Oelrueckfuehrung Frequenz"
    id: oil_return_freq
    register_type: holding
    address: 8231
    value_type: U_WORD
    unit_of_measurement: "Hz"
    state_class: measurement
    # Aendert sich nie von selbst. skip_updates zaehlt Controller-Zyklen, nicht
    # Sekunden - bei update_interval: 10s am modbus_controller sind 360 Zyklen
    # also eine Stunde. (update_interval gibt es bei modbus_controller nur am Hub,
    # nicht pro Entity.)
    skip_updates: 360
    # P41, Bereich 10~100 Hz, Werkseinstellung laut Hofman-Tabelle 50 Hz.
    # "actual value", also keine Skalierung.

# -------------------- Abtau-Parameter: nur lesen (0x2000) --------------------
# Diagnose der Vereisungsepisode vom 24.08.2026: Der Verdampfer lief zwischen
# 08:39 und 09:20 bis auf -12 °C runter, obwohl P29 (Startschwelle) auf -3 °C
# steht und die letzte Abtauung 2 h 40 min zurueck lag. Es muss also eine zweite
# Bedingung greifen - P85 (Umgebungstemperatur-Sperre) oder P86 (geforderte
# Differenz Umgebung/Lamelle). Beides ist bislang nicht ausgelesen.
#
# Bewusst erst nur lesend: erst sehen, womit der Regler ueberhaupt arbeitet,
# bevor irgendwer daran dreht. Zum Schreiben spaeter reicht der Wechsel von
# "sensor:" auf "number:" mit min_value/max_value aus der Hofman-Tabelle.
#
# Konfigurationsregister aendern sich nie von selbst - skip_updates zaehlt
# Controller-Zyklen, bei update_interval: 10s sind 360 also eine Stunde.

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Abtau Intervall-Multiplikator"
    id: defrost_interval_multiplier
    register_type: holding
    address: 8216
    skip_updates: 360
    value_type: U_WORD
    state_class: measurement
    entity_category: diagnostic
    # P26, Bereich 0~4. ACHTUNG: 0 bedeutet "gar keine Abtauung".
    # 1/2/3/4 multiplizieren den Zyklus aus P27.

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Abtau Zyklus"
    id: defrost_cycle_minutes
    register_type: holding
    address: 8217
    skip_updates: 360
    value_type: U_WORD
    unit_of_measurement: "min"
    state_class: measurement
    entity_category: diagnostic
    # P27, Bereich 15~99 min. Mindestabstand zwischen zwei Abtauungen,
    # zusammen mit P26 der eigentliche Takt.

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Abtau Maximaldauer"
    id: defrost_max_minutes
    register_type: holding
    address: 8221
    skip_updates: 360
    value_type: U_WORD
    unit_of_measurement: "min"
    state_class: measurement
    entity_category: diagnostic
    # P31, Bereich 2~20 min. Nach dieser Zeit bricht die Abtauung ab, auch wenn
    # die Lamelle die Endtemperatur aus P30 (20 °C) nicht erreicht hat.

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Abtau Umgebungstemperatur-Grenze"
    id: defrost_ambient_limit
    register_type: holding
    address: 8275
    skip_updates: 360
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    filters:
      - multiply: 0.1
    # P85 "Ambient temperature for defrosting", Bereich 0~20 °C. Oberhalb dieser
    # Aussentemperatur taut der Regler nicht ab. Kritisch, weil der interne
    # AT-Fuehler der Avarma in der Sonne bis zu 4 K zu warm misst (gemessen am
    # 24.08.2026 gegen sensor.temperaturfuhler_heizung_temperatur): bei realen
    # 2 °C und Sonne meldet er 6-7 °C und kann die Abtauung sperren.

# -------------------- Betriebsgrenzen: nur lesen (0x2000) --------------------
# Aufgenommen 2026-08-24, um zwei offene Fragen dieses Tages beantworten zu koennen.
# Alle bewusst nur lesend - es sind Schutz- und Auslegungsgrenzen, keine Sollwerte.
# Konfigurationsregister, aendern sich nie von selbst: skip_updates 360 entspricht
# bei update_interval 10s einer Stunde.

  # P102 - Schutzgrenze fuer die Spreizung zwischen Ein- und Austritt, 8~20 °C.
  # Ausgelesen 2026-08-24: 12,0 K.
  #
  # Aufgenommen als Verdacht, der sich sofort erledigt hat - die Notiz bleibt, damit
  # der Irrtum nicht noch einmal gemacht wird: Am 24.08.2026 sah es im Log so aus,
  # als stuenden Vorlauf 45 °C gegen Ruecklauf 28,5 °C, also 16,5 K Spreizung. Die
  # 45 °C waren aber der SOLLWERT der Regelung, nicht der Istwert. Tatsaechlich lag
  # der Vorlauf bei 32,7-35,6 °C, die echte Spreizung bei 5-6 K - weit unter dieser
  # Grenze. Es gab also weder eine Schutzbegrenzung noch ein Hydraulikproblem.
  #
  # Merksatz fuer kuenftige Auswertungen: number.esphome_web_f34aa0_vorlauf_
  # solltemperatur ist der Stellwert, sensor.esphome_web_avarma_vorlauftemperatur
  # der Messwert. Im Regelungs-Log ("VLT angehoben 44->45") steht der Stellwert.
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Schutzgrenze Spreizung Vor- und Ruecklauf"
    id: water_delta_protection
    register_type: holding
    address: 8292
    skip_updates: 360
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  # P42/P43/P44 - Stromgrenzen des Kompressors, je 1~50 A.
  #
  # WARUM: heizung_vlt_kompressor_regelung.py hebt bei Unterversorgung den
  # Frequenzdeckel an (number.esphome_web_avarma_kompressor_maximalfrequenz).
  # Bindet in Wahrheit die Stromgrenze, laeuft das ins Leere - der Kompressor
  # bleibt stehen, wo er steht, und die Regelung deutet das als "am Deckel" und
  # legt weiter nach. Der Iststrom wird bereits geloggt (7,8 A am 24.08. mittags),
  # die Grenzen dazu fehlten.
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Kompressor Strom Frequenzanhebung gesperrt ab"
    id: comp_current_no_up
    register_type: holding
    address: 8232
    skip_updates: 360
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 1
    device_class: current
    state_class: measurement
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Kompressor Strom Frequenzabsenkung ab"
    id: comp_current_down
    register_type: holding
    address: 8233
    skip_updates: 360
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 1
    device_class: current
    state_class: measurement
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Kompressor Strom Abschaltung ab"
    id: comp_current_stop
    register_type: holding
    address: 8234
    skip_updates: 360
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 1
    device_class: current
    state_class: measurement
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  # P60 - hoechste Drehzahl, die der DC-Luefter fahren darf. Registerbereich laut
  # Hofman-Tabelle 500~1500 RPM, ausgelesen 2026-08-24: 900 RPM.
  #
  # BEANTWORTET: Die Frage war, ob hinter FAN_MAX_RPM = 900 in
  # heizung_vlt_kompressor_regelung.py noch Luftreserve steckt. Nein - 900 ist das
  # Maximum des Luefters dieser Avarma (2026-08-24). Der Registerbereich
  # bis 1500 gilt fuer die Baureihe, nicht fuer dieses Geraet. NICHT hochsetzen.
  #
  # Damit ist auch geklaert, dass am 24.08.2026 "Luefter auf Volllast 900 RPM"
  # wirklich das Ende der Fahnenstange war: Gegen die Vereisung blieb nur noch
  # Abtauen, mehr Luft gab es nicht.
  #
  # Skalierung wie bei P72 (Register 8262, empirisch bestaetigt 2026-07-23):
  # Rohwert * 10 = reale Drehzahl. Die Hofman-Tabelle schreibt "display value*10".
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Luefter Maximaldrehzahl (Anlage)"
    id: fan_max_speed_device
    register_type: holding
    address: 8250
    skip_updates: 360
    value_type: U_WORD
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    filters:
      - multiply: 10

# ============================================================================
# VOLLAUSLESUNG PARAMETERBLOCK 0x2000 - TEMPORAER (2026-08-25)
# ============================================================================
# Zweck: vollstaendige Sicherung aller Anlagenparameter, bevor ueber P87 ein
# Werksreset ausgeloest wird. Anlass ist E15 "Water flow error", der sich seit
# 24.08.2026 11:38 bei jedem Start reproduziert.
#
# BEWUSST OHNE SKALIERUNG: Hier stehen ROHWERTE, so wie sie im Register liegen.
# Das ist Absicht - beim Zurueckschreiben zaehlt der Rohwert, und jede
# Umrechnung waere eine zusaetzliche Fehlerquelle. Ein Wert von 50 kann also je
# nach Parameter 50 Hz, 5,0 Grad oder 500 RPM bedeuten; die Umrechnung steht in
# der Hofman-Tabelle (Hofman-Modbus-Tabelle).
#
# Alle als S_WORD gelesen: negative Temperaturen kommen damit korrekt heraus.
# Ein negativer Wert bei einem Parameter, der nur positiv sein kann, waere ein
# Rohwert ueber 32767 - kommt in diesem Block nicht vor.
#
# BLOCKGRENZEN (Korrektur 2026-08-25, nach dem ersten Fehlversuch):
# Modbus-Funktionscode 3 liest hoechstens 125 Register pro Anfrage. Der Bereich
# 8192-8326 sind 135 - ESPHome fasst benachbarte Register zu EINER Abfrage
# zusammen, und die war damit zu gross. Sie scheiterte komplett, und weil die
# schon vorher vorhandenen Parameter-Register (P26/P29/P86/P114 ...) im selben
# zusammenhaengenden Bereich liegen, lasen die ebenfalls nicht mehr.
# force_new_range: true erzwingt alle 10 Register eine neue Anfrage. Damit
# bleibt jede weit unter dem Limit, und ein nicht belegtes Register reisst nur
# seine neun Nachbarn mit statt den ganzen Block.
#
# NACH DEM SICHERN WIEDER ENTFERNEN: Dieser Block legt 135 Entities an. Er ist
# fuer die einmalige Dokumentation gedacht, nicht fuer den Dauerbetrieb.
# Zum Entfernen alles zwischen dieser Kopfzeile und "ENDE VOLLAUSLESUNG"
# loeschen und neu flashen.
# ============================================================================

  # P0 (0x2000+0): Function selection 1
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "PARAM P0 roh"
    id: praw_8192
    register_type: holding
    address: 8192
    force_new_range: true
    skip_updates: 6
    value_type: S_WORD
    entity_category: diagnostic

  # P1 (0x2000+1): Function selection 2
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "PARAM P1 roh"
    id: praw_8193
    register_type: holding
    address: 8193
    skip_updates: 6
    value_type: S_WORD
